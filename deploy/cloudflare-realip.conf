# Cloudflare 真实客户端 IP 还原
# 仅当请求来自 Cloudflare 网段时才信任 CF-Connecting-IP，
# 直连源站的请求不受影响（伪造该头无效）。
# 作用：让 $remote_addr / X-Forwarded-For 变成真实访客 IP，
#       否则登录限流、审计日志会把所有访客都算成 CF 的边缘 IP。
# 网段来源：https://api.cloudflare.com/client/v4/ips
# 变更时更新本文件并 nginx -s reload

# ---- IPv4 ----
set_real_ip_from 173.245.48.0/20;
